# PredictaCore PILOT — Custom distribution (one store, no App Store review)
#
# 1. Create app in Dev Dashboard → Custom distribution → enter store *.myshopify.com
# 2. Replace client_id below with the pilot app's Client ID from Partners
# 3. Replace handle if Partners assigned a different slug
# 4. npm run deploy:pilot
#
# Railway service: PredictaSEO-Pam-Pilot (separate from PredictaSEO-Core — do NOT overwrite Core keys)
#   URL: https://predictaseo-pam-pilot-production.up.railway.app
#   APP_DISTRIBUTION=single_merchant
#   SHOPIFY_CLIENT_ID=<Pam pilot client id>
#   SHOPIFY_CLIENT_SECRET=<Pam pilot secret>
#   SHOPIFY_APP_HANDLE=predictacore-pam-pilot
#   BILLING_DISABLED=true

client_id = "0dd0358bdbc797124e9a8ea77f09748c"
name = "PredictaCore-Pam-Pilot"
application_url = "https://predictaseo-pam-pilot-production.up.railway.app"
embedded = true
handle = "predictacore-pam-pilot"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["shop/update"]
  uri = "/webhooks/shop/update"

  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app/subscriptions_update"

  [[webhooks.subscriptions]]
  topics = ["products/delete"]
  uri = "/webhooks/products/delete"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

# Scopes: SEO + analytics (sessions/referrers/sales via ShopifyQL) + orders attribution.
# Also request Protected Customer Data Level 2 in Partners (required for shopifyqlQuery).
[access_scopes]
scopes = "read_products,write_products,read_content,write_content,read_locales,read_markets,read_themes,write_themes,read_locations,read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects,read_reports,read_orders"

[app_proxy]
url = "https://predictaseo-pam-pilot-production.up.railway.app/proxy"
subpath = "predictacore"
prefix = "apps"

[auth]
redirect_urls = [
  "https://predictaseo-pam-pilot-production.up.railway.app/auth/callback",
  "https://predictaseo-pam-pilot-production.up.railway.app/auth/shopify/callback",
  "https://predictaseo-pam-pilot-production.up.railway.app/api/auth/callback"
]
